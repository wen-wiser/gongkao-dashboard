*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55;padding-bottom:40px}

.meta-line{margin-top:6px;font-size:12px;opacity:.85}
section{margin-top:14px}
h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(15,23,42,.06);margin-bottom:10px}
/* 提醒 */
.alert{border-radius:14px;padding:11px 13px;margin-bottom:9px;border:1.5px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:flex-start}
.alert .ico{font-size:22px;line-height:1.2}
.alert .t{font-weight:600;font-size:14.5px}
.alert .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.alert .cd{margin-top:5px;font-size:12.5px;font-weight:700}
.alert a.btn{margin-left:auto;flex-shrink:0;font-size:12.5px;color:#fff;background:var(--c1);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap;align-self:center}
.alert.lv-red{background:var(--red-bg);border-color:#fca5a5}.alert.lv-red .cd{color:var(--red)}
.alert.lv-orange{background:var(--orange-bg);border-color:#fdba74}.alert.lv-orange .cd{color:var(--orange)}
.alert.lv-blue{background:var(--blue-bg);border-color:#93c5fd}.alert.lv-blue .cd{color:var(--blue)}
.alert.predicted{border-style:dashed}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;vertical-align:2px;margin-left:4px;font-weight:600}
.b-pred{background:#fef9c3;color:#a16207}
.b-done{background:var(--green-bg);color:var(--green)}
.b-ref{background:#f1f5f9;color:var(--muted)}
.pulse{animation:pu 1.6s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.55}}
/* 人物切换 */
.profiles{display:flex;gap:8px}
.pf{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:.15s}
.pf .nm{font-weight:700;font-size:14.5px}
.pf .tag{font-size:11.5px;color:var(--muted);margin-top:2px}
.pf.on{border-color:var(--c1);background:linear-gradient(135deg,#eef2ff,#faf5ff)}
.pf.on .nm{color:var(--c1)}
/* 内容页签 */
.tabs{display:flex;gap:6px;margin-top:12px;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0}
.tab{flex:1;text-align:center;padding:8px 2px;border-radius:10px;background:var(--card);font-size:13.5px;color:var(--muted);cursor:pointer;border:1.5px solid var(--line);white-space:nowrap}
.tab.on{background:var(--c1);color:#fff;border-color:var(--c1);font-weight:600}
/* 时间线 */
.tl-month{font-weight:700;color:var(--c1);font-size:13.5px;margin:12px 0 6px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-left:4px}
.ev.act{border-color:var(--c1)}
.ev .t{font-size:14px;font-weight:600}
.ev .t .rg{font-size:11px;color:#fff;background:var(--c1);border-radius:5px;padding:0 5px;margin-right:5px;font-weight:600}
.ev .rg.zj{background:#0891b2}.ev .rg.sh{background:#db2777}.ev .rg.ah{background:#d97706}.ev .rg.qg{background:#4f46e5}
.ev .d{font-size:12px;color:var(--muted);margin:2px 0}
.ev .n{font-size:12px;color:var(--muted)}
.ev .a{font-size:12px;margin-top:3px;display:inline-block;color:var(--blue);text-decoration:none}

.ann a{color:var(--ink);text-decoration:none}
.ann .m{font-size:11.5px;color:var(--muted);margin-top:4px}

.ann.ref{opacity:.72}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fchip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);color:var(--muted);cursor:pointer}
.fchip.on{background:var(--c1);color:#fff;border-color:var(--c1)}

.job .t{font-weight:600;font-size:14px}
.job .m{font-size:12px;color:var(--muted);margin-top:3px}
.job .m b{color:var(--ink);font-weight:600}

.hint{font-size:12px;color:var(--muted);background:var(--blue-bg);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.srcbox{font-size:12px;color:var(--muted)}
.srcbox .bad{color:var(--orange)}

.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.cmp th{background:#eef2ff;color:var(--c1);padding:6px;font-size:11.5px;text-align:left;white-space:nowrap}
.cmp td{border-top:1px solid var(--line);padding:6px;vertical-align:top;line-height:1.5}
.cmp td.item{white-space:nowrap;color:var(--muted);font-weight:600;font-size:11.5px}
.exam-card .pt{font-weight:700;font-size:14px;margin-top:10px}
.exam-card .pm{font-size:12.5px;margin:2px 0}
.exam-card .f{font-size:12px;color:var(--muted);margin:3px 0}
.exam-card .pill{display:inline-block;font-size:10.5px;background:#f1f5f9;color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:400;vertical-align:1px}
.difftag{display:inline-block;font-size:10px;background:#fee2e2;color:var(--red);border-radius:5px;padding:0 5px;margin-left:3px;font-weight:600;vertical-align:1px}
.adv{border-radius:14px;padding:11px 13px;margin-bottom:9px;background:var(--card);border:1.5px solid var(--line)}
.adv h3{font-size:14px;margin-bottom:6px}

.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:20px 0}

/* ================= 应用 ================= */
const PROFILES = {
  A:{nm:"👩‍🎨 闺蜜A", tag:"城乡规划 · 2027应届"},
  B:{nm:"👩‍🏫 闺蜜B", tag:"汉语言师范 · 教师编+考公"}
};
const ACTION_ICO = {缴费:"💰",报名:"📝",笔试:"✏️",准考证:"🖨️",公告:"📢",成绩:"🔍"};
const REG_CLS = {"江苏":"","浙江":" zj","上海":" sh","安徽":" ah","全国":" qg"};
const WD = ["日","一","二","三","四","五","六"];
let DATA_ = null, state = {profile: localStorage.getItem("gkb_profile")||"A", tab:"timeline", annRegion:"全部", examRegion:"全部"};
let stars = JSON.parse(localStorage.getItem("gkb_stars")||'{"A":[],"B":[]}');

const norm = x => Array.isArray(x)?x:(x?[x]:["A","B"]);
const ownOf = it => norm(it.owner||it.owners);
const endMs = e => { const s=String(e.end||e.start); let d=new Date(s.length<=10?s+"T23:59":s.replace(" ","T")); return isNaN(d)?Date.now():(s.length<=10?d.getTime()+44*60000:d.getTime()); };
const startMs = e => new Date(String(e.start).replace(" ","T")).getTime()||0;
const fmtD = s => { const d=new Date(String(s).replace(" ","T")); return isNaN(d)?String(s):`${d.getMonth()+1}月${d.getDate()}日${s.length>10?" "+String(s).slice(11,16):""}`; };
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadAll(){
  try{
    const [m,e,a,j,x] = await Promise.all(["meta","events","announcements","jobs","exam"].map(n=>
      fetch(`data/${n}.json?t=${Date.now()}`).then(r=>{if(!r.ok)throw 0;return r.json()})));
    return {meta:m, events:e.events||e, announcements:a.announcements||a, jobs:j.jobs?j:{jobs:j}, exam:x};
  }catch(err){
    try{ // 离线兜底：上次成功加载的缓存
      const c=JSON.parse(localStorage.getItem("gkb_cache"));
      if(c&&c.events) return c;
    }catch(e){}
    return {meta:__SEED__.meta, events:__SEED__.events, announcements:__SEED__.announcements, jobs:__SEED__.jobs, exam:__SEED__.exam};
  }
}

function renderMeta(){
  const m=DATA_.meta, now=new Date();
  document.getElementById("updatedAt").textContent=`⏰ 数据更新于 ${m.last_updated_display||"未知"}`;
  const fail=(m.sources_status||[]).filter(s=>!s.ok);
  document.getElementById("metaLine").innerHTML=
    `每${m.next_check_hours||4}小时自动巡检 · 今天是 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${WD[now.getDay()]}`;
  document.getElementById("srcStatus").innerHTML = fail.length?
    `<div class="card srcbox">⚠️ 本轮巡检 ${fail.length} 个官网访问超时（<span class="bad">${fail.map(f=>esc(f.name)).join("、")}</span>），已保留历史数据，下轮自动重试</div>`:"";
}

function activeEvents(){
  const now=Date.now();
  return DATA_.events.filter(e=>ownOf(e).includes(state.profile) && e.status!=="done" && endMs(e)>=now-3600e3);
}
function renderAlerts(){
  const now=Date.now(), DAY=86400e5?86400e3:0; const D=86400e3;
  // 关注岗位的截止也并入提醒
  const starred = DATA_.jobs.jobs.filter(j=>stars[state.profile].includes(j.id) && j.deadline).map(j=>({
    title:"⭐ "+j.unit+"·"+j.position, action:"报名", start:j.start||j.deadline, end:j.deadline,
    status:"confirmed", link:j.url, note:"来自我的关注"}));
  const list=[...activeEvents(),...starred].sort((a,b)=>{
    const pa=a.status==="predicted"?1:0, pb=b.status==="predicted"?1:0;
    return (pa-pb)||(endMs(a)-endMs(b));});
  const box=document.getElementById("alerts");
  if(!list.length){box.innerHTML='<div class="empty">当前身份暂无进行中的事项 ✅</div>';return;}
  box.innerHTML=list.slice(0,10).map(e=>{
    const dl=Math.ceil((endMs(e)-now)/D), started=startMs(e)<=now;
    let lv="lv-blue", cd;
    if(dl<=0){cd="⚠️ 今天截止！";lv="lv-red";}
    else if(dl<=3){cd=`⏳ 仅剩 ${dl} 天`;lv="lv-red";}
    else if(dl<=7){cd=`⏳ 剩 ${dl} 天`;lv="lv-orange";}
    else cd=`📅 ${fmtD(e.start)} 开始 · ${fmtD(e.end)} 截止`;
    if(!started&&dl>3)cd=`📅 ${fmtD(e.start)} 开始`;
    const pred=e.status==="predicted"?'<span class="badge b-pred">预计·以公告为准</span>':"";
    return `<div class="alert ${lv} ${e.status==="predicted"?"predicted":""}">
      <div class="ico">${ACTION_ICO[e.action]||"📌"}</div>
      <div style="flex:1"><div class="t">${esc(e.title)}${pred}</div>
      <div class="d">${e.region||""} · ${e.type||""}${e.note?" · "+esc(e.note):""}</div>
      <div class="cd ${lv==="lv-red"?"pulse":""}">${cd}</div></div>
      ${e.link?`<a class="btn" target="_blank" href="${esc(e.link)}">去办理 ›</a>`:""}</div>`;
  }).join("") + (list.length>10?`<div class="empty">还有 ${list.length-10} 条较远期事项，见「时间线」</div>`:"");
}

function renderProfiles(){
  document.getElementById("profiles").innerHTML=Object.entries(PROFILES).map(([k,p])=>
    `<div class="pf ${state.profile===k?"on":""}" onclick="switchPf('${k}')"><div class="nm">${p.nm}</div><div class="tag">${p.tag}</div></div>`).join("");
}
function switchPf(k){state.profile=k;localStorage.setItem("gkb_profile",k);renderProfiles();renderAlerts();renderTab();}
function switchTab(t){state.tab=t;renderTabs();renderTab();window.scrollTo({top:document.getElementById("profiles").offsetTop-60,behavior:"smooth"});}
function renderTabs(){
  const tabs=[["timeline","📅 时间线"],["ann","📢 公告"],["jobs","💼 岗位"],["exam","📝 题型"],["score","📊 分数·人数"]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,n])=>
    `<div class="tab ${state.tab===k?"on":""}" onclick="switchTab('${k}')">${n}</div>`).join("");
}
function renderTab(){
  ({timeline:renderTimeline,ann:renderAnn,jobs:renderJobs,exam:renderExam,score:renderScore})[state.tab]();
}

function renderTimeline(){
  const evs=[...activeEvents(),...DATA_.events.filter(e=>ownOf(e).includes(state.profile)&&e.status==="done")]
    .sort((a,b)=>startMs(a)-startMs(b));
  const months={};
  evs.forEach(e=>{const d=new Date(String(e.start).replace(" ","T"));const k=isNaN(d)?String(e.start).slice(0,7):`${d.getFullYear()}年${d.getMonth()+1}月`;(months[k]=months[k]||[]).push(e);});
  document.getElementById("main").innerHTML=Object.entries(months).map(([mo,list])=>
    `<div class="tl-month">${mo}</div>`+list.map(e=>{
      const started=startMs(e)<=Date.now(), done=endMs(e)<Date.now();
      const chip=done?'<span class="badge b-done">已结束</span>':(e.status==="predicted"?'<span class="badge b-pred">预计</span>':"");
      return `<div class="ev ${started&&!done?"act":""}"><div class="t"><span class="rg${REG_CLS[e.region]||""}">${e.region||""}</span>${esc(e.title)} ${chip}</div>
        <div class="d">🕐 ${fmtD(e.start)} → ${fmtD(e.end)} · ${ACTION_ICO[e.action]||""}${e.action||""}</div>
        ${e.note?`<div class="n">${esc(e.note)}</div>`:""}
        ${e.link?`<a class="a" target="_blank" href="${esc(e.link)}">原文入口 ›</a>`:""}</div>`;
    }).join("")).join("");
}

let annCache=null;
function renderAnn(){
  if(!annCache){
    document.getElementById("main").innerHTML='<div class="empty">加载中…</div>';
  }
  const regions=["全部","江苏","浙江","上海","安徽","全国"];
  const list=DATA_.announcements.filter(a=>ownOf(a).includes(state.profile)&&(state.annRegion==="全部"||a.region===state.annRegion||a.region==="长三角"||a.region==="江浙沪皖"));
  document.getElementById("main").innerHTML=
    `<div class="filters">${regions.map(r=>`<span class="fchip ${state.annRegion===r?"on":""}" onclick="state.annRegion='${r}';renderAnn()">${r}</span>`).join("")}</div>`+
    (list.length?list.map(a=>{
      const ref=a.is_reference?' <span class="badge b-ref">往期参考</span>':"";
      return `<div class="card ann ${a.is_reference?"ref":""}">
        <div class="t"><a target="_blank" href="${esc(a.url)}">${esc(a.title)}</a>${ref}</div>
        ${a.ref_note?`<div class="m">${esc(a.ref_note)}</div>`:""}
        <div class="m"><span class="chip">${a.region||""}</span><span class="chip">${a.exam_type||""}</span>
        📅 ${a.date||""} · ${esc(a.source||"")}${a.discovered_display?` · ${esc(a.discovered_display)}`:""}</div></div>`;
    }).join(""):'<div class="empty">暂无该地区公告</div>');
}

function renderJobs(){
  const all=DATA_.jobs.jobs, s=DATA_.jobs.summary||{};
  const mine=all.filter(j=>ownOf(j).includes(state.profile));
  const starred=mine.filter(j=>stars[state.profile].includes(j.id));
  const rest=mine.filter(j=>!stars[state.profile].includes(j.id));
  const row=j=>{
    const on=stars[state.profile].includes(j.id);
    return `<div class="card job"><button class="star ${on?"on":""}" onclick="toggleStar('${j.id}')">${on?"★":"☆"}</button>
      <div class="t">${j.is_reference?"💡 ":""}${esc(j.unit)}</div>
      <div class="m"><b>${esc(j.position)}</b></div>
      <div class="m">🎓 ${esc(j.major||j.majors||"")}</div>
      <div class="m">🏷️ ${esc(j.identity||"")} ${j.deadline?`· ⏰ 截止 ${fmtD(j.deadline)}`:""}</div>
      ${j.note?`<div class="m">${esc(j.note)}</div>`:""}
      ${j.url?`<div class="m"><a href="${esc(j.url)}" target="_blank" style="color:var(--blue)">查看原文 ›</a></div>`:""}</div>`;
  };
  document.getElementById("main").innerHTML=
    `<div class="sumline">📋 ${esc(s.note||"")} ${s.total?`（共${s.total}岗 · A可报${s.matched_A||0} · B可报${s.matched_B||0}）`:""}</div>`+
    (starred.length?`<h2>⭐ 我的关注（置顶）</h2>`+starred.map(row).join(""):"")+
    `<h2>💼 岗位列表 ${mine.length?`（${mine.length}）`:""}</h2>`+
    (rest.length?rest.map(row).join(""):'<div class="empty">职位表发布后将自动填充</div>');
}
function toggleStar(id){
  const arr=stars[state.profile], i=arr.indexOf(id);
  i>=0?arr.splice(i,1):arr.push(id);
  localStorage.setItem("gkb_stars",JSON.stringify(stars));
  renderTab();
}

function renderExam(){
  const X=DATA_.exam;
  const box=document.getElementById("main");
  if(!X||!X.regions){box.innerHTML='<div class="empty">题型数据未载入，联网后将自动获取</div>';return;}
  const regions=["全部","国考","江苏","浙江","上海","安徽","事业编","教师编"];
  let html=`<div class="hint">ℹ️ 题型整理于 ${esc(X.updated_display||"")} · 依据2026年度最新考情整理，逐年微调，以当年官方大纲为准</div>`;
  const D=X.diffs;
  if(D&&D.rows){html+=`<div class="card exam-card"><div class="pt" style="margin-top:0">⚡ 重点对比 · ${esc(D.title)}</div>
    <table class="cmp"><tr><th>对比项</th><th>江苏省考 B类</th><th>国考</th></tr>`+
    D.rows.map(r=>`<tr><td class="item">${esc(r.item)}${r.hot?'<span class="difftag">差异大</span>':""}</td><td>${esc(r.js)}</td><td>${esc(r.gk)}</td></tr>`).join("")+
    `</table>`+
    (D.takeaways||[]).map(t=>`<div class="f">✅ ${esc(t)}</div>`).join("")+`</div>`;}
  html+=`<div class="filters">${regions.map(r=>`<span class="fchip ${state.examRegion===r?"on":""}" onclick="state.examRegion='${r}';renderExam()">${r}</span>`).join("")}</div>`;
  html+=(X.regions||[]).filter(g=>state.examRegion==="全部"||g.name===state.examRegion).map(g=>
    `<div class="card exam-card"><div class="pt" style="margin-top:0">📍 ${esc(g.name)}<span class="pill">${esc(g.tag||"")}</span></div>`+
    (g.papers||[]).map(p=>`<div class="pt">${esc(p.name)}</div>`+
      (p.meta?`<div class="f">🕐 ${esc(p.meta)}</div>`:"")+
      (p.modules||[]).map(m=>`<div class="pm">· ${esc(m)}</div>`).join("")+
      (p.features||[]).map(f=>`<div class="f">▸ ${esc(f)}</div>`).join("")).join("")+
    (g.interview?`<div class="pt">🎤 面试</div><div class="pm">${esc(g.interview)}</div>`:"")+
    (g.note?`<div class="f">💡 ${esc(g.note)}</div>`:"")+`</div>`).join("");
  html+=`<h2>🎯 备考建议（A / B 分别呈现）</h2>`+(X.advice||[]).map(a=>
    `<div class="adv ${a.who==="A"?"a1":"b1"}"><h3>${esc(a.title)}</h3><ul>${(a.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
  box.innerHTML=html;
}

    ["国考 2027","2026-11-29","2027年1月中旬","http://bm.scs.gov.cn/kl2027","报名人数：报名期官方每日更新（已截止）"],

(async function init(){
  DATA_=await loadAll();
  try{localStorage.setItem("gkb_cache",JSON.stringify(DATA_));}catch(e){}
  renderMeta();renderAlerts();renderProfiles();renderTabs();renderTab();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
